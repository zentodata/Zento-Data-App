
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Minimalista Zento Data App</title>
      <meta name="description" content="Zento Data offers a minimalist web application that provides real-time notifications and user management features, enhancing operational efficiency for businesses." />
      <meta name="robots" content="noindex, nofollow" />

      <!-- PWA: manifest -->
      <link rel="manifest" href="/manifest.json" />
      <meta name="theme-color" content="#0ea5c8" />

      <!-- PWA: íconos reales del repo -->
      <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
      <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96x96.png" />
      <link rel="shortcut icon" href="/icons/favicon.ico" />
      <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>

      <!-- PWA: registro del service worker (usa BASE_URL para respetar el base de vite.config.ts) -->
      <script type="module">
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register(import.meta.env.BASE_URL + 'sw.js');
          });
        }
      </script>
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
